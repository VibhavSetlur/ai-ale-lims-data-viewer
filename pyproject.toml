[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ale-lims-viewer-kind-static"
version = "0.0.0"
description = "Provisional local static launcher for the AI-ALE LIMS viewer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-ale-lims-viewer-kind-static = "ai_ale_kind_static.cli:main"

[tool.setuptools]
packages = ["ai_ale_kind_static"]
include-package-data = false
