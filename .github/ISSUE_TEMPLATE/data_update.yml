name: Data update request
description: New data in the LIMS database that you want reflected in the viewer (new samples, copy number runs, growth curves, barcode data, etc.)
title: "[Data]: "
labels: ["data-update"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request a data refresh or to flag that new upstream data is ready to appear in the viewer. No technical knowledge needed -- just tell us what you added and where you expect to see it.

  - type: dropdown
    id: deployment
    attributes:
      label: Which viewer instance should be updated?
      options:
        - "Dev (modelseed.org/annotation/projects/aiale-dev/)"
        - "Public (modelseed.org/annotation/projects/aiale/) -- Vibhav approves this"
        - "Both"
        - "Not sure -- just dev for now"
    validations:
      required: true

  - type: dropdown
    id: data_type
    attributes:
      label: What kind of data was added or changed?
      multiple: true
      options:
        - New samples or sequencing runs (mutations / seqorders)
        - New copy number data
        - New growth curve data
        - New barcode data (verAB_barcodes)
        - Updated or corrected existing data
        - New experiment or condition group
        - Something else
    validations:
      required: true

  - type: textarea
    id: what_changed
    attributes:
      label: What did you add or change?
      description: "Be as specific as you can. For example: added copy number calls for TFMN4 transfers 10-15, or added barcode data for Plasmidsaurus run ZQT7PJ."
    validations:
      required: true

  - type: textarea
    id: where_to_verify
    attributes:
      label: Where should we be able to see it in the viewer?
      description: "For example: Copy Number tab should show new lineages, or Sample Selection seqorder chip should include the new run name."
    validations:
      required: true

  - type: textarea
    id: upstream_location
    attributes:
      label: Where is the data in the upstream LIMS?
      description: "Table name, experiment ID, seqorder name, or any identifier that helps us confirm the data is present before refreshing."

  - type: dropdown
    id: viewer_change_needed
    attributes:
      label: Do you think the viewer needs a code change, or is this just a data refresh?
      options:
        - "Just a data refresh -- the viewer already supports this type of data"
        - "Viewer change likely needed -- new type of data or new view required"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: viewer_change_details
    attributes:
      label: If a viewer change is needed, describe what you would like to see
      description: "Only fill this in if you selected 'Viewer change likely needed' above."

  - type: markdown
    attributes:
      value: |
        ---
        Once submitted, the data sync workflow will refresh the dev DB from the upstream mirror, rebake the static data, and redeploy to the dev URL. You will get a comment here when it is ready to verify.
