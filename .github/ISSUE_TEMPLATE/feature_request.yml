name: Feature request
description: Have an idea for something new or an improvement to the viewer? Tell us here.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! This form is for suggesting a new feature or an improvement to an existing one. There are no wrong answers - just tell us what would make the viewer more useful for you.

  - type: dropdown
    id: deployment
    attributes:
      label: Which version of the viewer is this about?
      options:
        - "Public (modelseed.org/annotation/projects/aiale/)"
        - "Dev (modelseed.org/annotation/projects/aiale-dev/)"
        - "Either / general"
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: Which tab or view is this about?
      options:
        - Database Tables
        - Mutation Explorer
        - Sample Selection
        - Compare Mutations
        - Compare Growth Curves
        - Compare Library Variants
        - Copy Number
        - Barcode Charts
        - New or general idea

  - type: textarea
    id: request
    attributes:
      label: What would you like to be able to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would this help you?
      description: Tell us about your use case.

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would help a lot
        - Blocking my work

  - type: textarea
    id: examples
    attributes:
      label: "Examples, sketches, or screenshots"
      description: Anything that shows what you have in mind. You can drag images in here.
